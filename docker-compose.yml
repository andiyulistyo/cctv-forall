services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: detection-dashboard:cpu
    container_name: detection-dashboard
    ports:
      - "8000:8000"
    volumes:
      # Persists SQLite DB and cropped plate images across restarts.
      - ./data:/app/data
    environment:
      # Change these before exposing the app anywhere real.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      # Detection tuning
      DEVICE: ${DEVICE:-}            # empty = auto (cpu here)
      FRAME_STRIDE: ${FRAME_STRIDE:-2}
      CONF_THRESHOLD: ${CONF_THRESHOLD:-0.35}
      INFERENCE_IMGSZ: ${INFERENCE_IMGSZ:-640}
      INFERENCE_HALF: ${INFERENCE_HALF:-false}
      PROCESS_WIDTH: ${PROCESS_WIDTH:-0}
      # Performance
      THREADS_PER_WORKER: ${THREADS_PER_WORKER:-0}
      EXPECTED_STREAMS: ${EXPECTED_STREAMS:-4}
      FFMPEG_HWACCEL: ${FFMPEG_HWACCEL:-}
      RTSP_TRANSPORT_TCP: ${RTSP_TRANSPORT_TCP:-true}
      ALPR_ENABLED: ${ALPR_ENABLED:-true}
      OCR_DEVICE: ${OCR_DEVICE:-}
      FACE_ENABLED: ${FACE_ENABLED:-true}
      FACE_SIMILARITY_THRESHOLD: ${FACE_SIMILARITY_THRESHOLD:-0.363}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
    restart: unless-stopped
